<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style> body { width:1200px; height:627px; }
.l { position:absolute; left:70px; top:60px; width:600px; } .r { position:absolute; right:60px; top:70px; width:440px; } </style></head>
<body>
  <div class="l">
    <p class="eyebrow" style="font-size:20px">AI employee for restaurants</p>
    <h1 class="display" style="font-size:66px; line-height:1.02; margin-top:18px">Your food costs, bought right.</h1>
    <p style="font-size:24px; color:var(--muted); margin-top:22px; line-height:1.4">Orders to par from the cheapest supplier. Checks every invoice against the order.</p>
    <span class="pill" style="background:var(--accent); color:#fff; font-size:24px; margin-top:34px">14-day free trial</span>
  </div>
  <div class="card r" style="padding:30px; font-size:22px">
    <p style="color:var(--muted); font-size:18px">Purchasing Manager</p>
    <p class="display" style="font-size:34px; margin:6px 0 16px">Thursday order ready</p>
    <div class="row" style="padding:10px 0; border-bottom:1px solid var(--line)"><span>Coastal Foodservice</span><b>$877</b></div>
    <div class="row" style="padding:10px 0; border-bottom:1px solid var(--line)"><span>Local Produce Co</span><b>$138</b></div>
    <div class="row" style="padding:10px 0"><span>Overcharges caught</span><b style="color:var(--bad)">$95</b></div>
    <div style="background:var(--brand); color:var(--brand-ink); text-align:center; border-radius:999px; padding:14px; margin-top:14px; font-weight:600">Approve and send</div>
  </div>
</body></html>
