name: ci
on: [push, pull_request]

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: factory, POSTGRES_PASSWORD: factory, POSTGRES_DB: factory}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run factory migrate
      - run: uv run factory build employees/restaurant_purchasing
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {package_json_file: apps/web/package.json}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm build
