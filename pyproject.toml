[project]
name = "ai-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
factory = "factory.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/factory", "employees"]

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
